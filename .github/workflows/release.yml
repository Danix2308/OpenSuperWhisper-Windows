name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified runtime and build
        shell: powershell
        run: .\setup-windows.ps1
      - name: Add release files
        shell: powershell
        run: |
          Copy-Item .\LICENSE .\dist\LICENSE -Force
          Copy-Item .\THIRD_PARTY_NOTICES.md .\dist\THIRD_PARTY_NOTICES.md -Force
          Copy-Item .\uninstall.ps1 .\dist\uninstall.ps1 -Force
          Copy-Item .\README.md .\dist\README.md -Force
      - name: Package and checksum
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\* -DestinationPath .\OpenSuperWhisper-Windows.zip -CompressionLevel Optimal
          $hash = (Get-FileHash .\OpenSuperWhisper-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OpenSuperWhisper-Windows.zip" | Set-Content .\OpenSuperWhisper-Windows.zip.sha256 -Encoding ascii
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" .\OpenSuperWhisper-Windows.zip .\OpenSuperWhisper-Windows.zip.sha256 --title "OpenSuperWhisper for Windows ${{ github.ref_name }}" --generate-notes
